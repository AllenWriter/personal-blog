# 小举人 blog (adjens.com). Served through the Cloudflare proxy (the host only
# accepts 80/443 from Cloudflare). Static files come from the xiaojuren-blog
# container on 172.18.0.1:8081; this file only routes and terminates TLS.
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name adjens.com www.adjens.com;

    # Cloudflare→origin certificate (self-signed; valid for SSL mode "Full").
    ssl_certificate     /etc/nginx/certs/adjens-fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/adjens-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Visitors on http, or on www, go to https://adjens.com.
    set $canonical 0;
    if ($http_x_forwarded_proto = "http") { set $canonical 1; }
    if ($host = "www.adjens.com") { set $canonical 1; }
    if ($canonical) { return 301 https://adjens.com$request_uri; }

    location / {
        proxy_pass http://172.18.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
    }
}
