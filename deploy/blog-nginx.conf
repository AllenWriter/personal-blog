# Runs inside the xiaojuren-blog container. Serves the static build in /site.
server {
    listen 80;
    server_name _;
    root /site;
    charset utf-8;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/xml application/atom+xml image/svg+xml text/plain;

    # Let's Encrypt HTTP-01 challenges.
    location ^~ /.well-known/acme-challenge/ { root /acme; default_type text/plain; }

    # Old multilingual URLs.
    location ~ ^/(zh-CN|zh-TW|ko|ru|de|fr|es|pt)(/.*)?$ { return 301 $2; }
    location ~ ^/(zh-CN|zh-TW|ko|ru|de|fr|es|pt)$ { return 301 /; }

    # English and Japanese editions. A page that has not been translated yet
    # falls back to the Chinese original instead of a 404.
    # /en/ -> /en, /ja/blog/ -> /ja/blog (stay in the same language)
    location ~ ^/(en|ja)(/.*)?/$ { return 301 /$1$2; }
    location ~ ^/(en|ja)(/.*)?$ {
        try_files $uri $uri.html $uri/index.html @source;
    }
    location @source {
        rewrite ^/(?:en|ja)(/.*)?$ $1 redirect;
    }

    # /blog/ -> /blog (pages are written as blog.html)
    location ~ ^(.+)/$ { return 301 $1; }

    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location /blog/covers/ { expires 30d; }

    location / { try_files $uri $uri.html $uri/index.html =404; }
    error_page 404 /404.html;
}
